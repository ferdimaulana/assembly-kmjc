<script>
    const CLOUD_URL = 'https://assembly-koper-kmj2-default-rtdb.asia-southeast1.firebasedatabase.app';
    const ROOM_CODE = 'GEDUNG-C-LINE1';
    const LOCAL_KEY = 'SMO_AFG_HARDCODED_V1';

    const defaultData = {
      poNumber: 'PO-KOPER-01',
      targetPO: 470,
      logs: [
        {
          id: 'init-1',
          tanggal: '2026-10-16',
          assembly: 399,
          fg: 399,
          catatan: 'Saldo Awal Akumulasi Output'
        }
      ]
    };

    let appData = JSON.parse(JSON.stringify(defaultData));

    async function initApp() {
      const inputTgl = document.getElementById('inputTanggal');
      if (inputTgl) inputTgl.value = new Date().toISOString().split('T')[0];

      // Ambil cache lokal hanya untuk tampilan awal
      const cached = localStorage.getItem(LOCAL_KEY);
      if (cached) {
        try { appData = JSON.parse(cached); } catch (e) {}
      }
      hitungDanRender();

      // Prioritaskan sinkronisasi dari Cloud
      await tarikDariCloud();

      // Auto polling: cek pembaruan data dari perangkat lain setiap 10 detik
      setInterval(tarikDariCloud, 10000);
    }

    async function tarikDariCloud() {
      try {
        const res = await fetch(`${CLOUD_URL}/smo_afg/${ROOM_CODE}.json`);
        if (!res.ok) throw new Error('Respon server gagal');
        
        const remoteData = await res.json();

        if (remoteData && Array.isArray(remoteData.logs)) {
          // Update data jika ada data valid di cloud
          appData = remoteData;
          localStorage.setItem(LOCAL_KEY, JSON.stringify(appData));
          hitungDanRender();
          updateBadge('Cloud Terhubung (Auto-Sync)', 'bg-emerald-600');
        } else if (!remoteData) {
          // Cloud benar-benar null (pertama kali setup), baru kirim local default
          await simpanKeCloud();
        }
      } catch (err) {
        console.warn('Gagal sinkron cloud:', err);
        updateBadge('Mode Offline / Izin Ditolak', 'bg-rose-600');
      }
    }

    async function simpanKeCloud() {
      updateBadge('Menyimpan ke Cloud...', 'bg-amber-500');
      try {
        const res = await fetch(`${CLOUD_URL}/smo_afg/${ROOM_CODE}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(appData)
        });
        if (res.ok) {
          updateBadge('Cloud Terhubung (Auto-Sync)', 'bg-emerald-600');
        } else {
          updateBadge('Gagal Simpan (Cek Rules Firebase)', 'bg-rose-600');
        }
      } catch (err) {
        updateBadge('Tersimpan Offline', 'bg-slate-600');
      }
    }

    function simpanData() {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(appData));
      hitungDanRender();
      simpanKeCloud();
    }

    function updateBadge(text, colorClass) {
      const badge = document.getElementById('syncBadge');
      if (badge) {
        badge.className = `text-xs px-2.5 py-1 rounded-full font-medium text-white ${colorClass}`;
        badge.innerText = text;
      }
    }

    function hitungDanRender() {
      const target = Number(appData.targetPO) || 470;
      const logs = Array.isArray(appData.logs) ? appData.logs : [];
      const totalOutput = logs.reduce((acc, item) => acc + (Number(item.assembly) || 0), 0);
      const totalFG = logs.reduce((acc, item) => acc + (Number(item.fg) || 0), 0);
      const shortage = Math.max(0, target - totalOutput);
      const wip = Math.max(0, totalOutput - totalFG);
      const progress = target > 0 ? ((totalOutput / target) * 100).toFixed(2) : 0;

      document.getElementById('cardTarget').innerHTML = `${target} <span class="text-sm font-normal">pcs</span>`;
      document.getElementById('poNameLabel').innerText = appData.poNumber || 'PO-KOPER-01';
      document.getElementById('cardOutput').innerHTML = `${totalOutput} <span class="text-sm font-normal">pcs</span>`;
      document.getElementById('cardProgress').innerText = `Progress: ${progress}%`;
      document.getElementById('cardShortage').innerHTML = `${shortage} <span class="text-sm font-normal">pcs</span>`;
      document.getElementById('cardFG').innerHTML = `${totalFG} <span class="text-sm font-normal">pcs</span>`;
      document.getElementById('cardWIP').innerText = `Tertahan di Assembly (WIP): ${wip} pcs`;

      const skipSundayElem = document.getElementById('skipSunday');
      const skipSunday = skipSundayElem ? skipSundayElem.checked : true;

      if (shortage === 0) {
        document.getElementById('estOptDays').innerText = 'PO Selesai (100%)';
        document.getElementById('estOptDate').innerText = 'Target telah terpenuhi';
        document.getElementById('estConDays').innerText = 'PO Selesai (100%)';
        document.getElementById('estConDate').innerText = 'Target telah terpenuhi';
      } else {
        const hariOpt = Math.ceil(shortage / 18);
        const hariCon = Math.ceil(shortage / 15);
        document.getElementById('estOptDays').innerText = `${hariOpt} Hari Kerja (${(shortage/18).toFixed(1)} hr)`;
        document.getElementById('estOptDate').innerText = `Selesai: ${tambahHariKerja(hariOpt, skipSunday)}`;
        document.getElementById('estConDays').innerText = `${hariCon} Hari Kerja (${(shortage/15).toFixed(1)} hr)`;
        document.getElementById('estConDate').innerText = `Selesai: ${tambahHariKerja(hariCon, skipSunday)}`;
      }

      const tbody = document.getElementById('tabelBody');
      tbody.innerHTML = '';
      logs.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-medium">${item.tanggal}</td>
          <td class="py-2.5 px-3 text-emerald-700 font-bold">${item.assembly} pcs</td>
          <td class="py-2.5 px-3 text-amber-700 font-bold">${item.fg} pcs</td>
          <td class="py-2.5 px-3 text-slate-500">${item.catatan || '-'}</td>
          <td class="py-2.5 px-3 text-right space-x-2">
            <button onclick="editBaris(${index})" class="text-xs text-indigo-600 hover:underline font-semibold">Edit</button>
            <button onclick="hapusBaris(${index})" class="text-xs text-rose-600 hover:underline font-semibold">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function tambahHariKerja(jumlahHari, skipSunday) {
      let tanggal = new Date();
      let sisa = jumlahHari;
      while (sisa > 0) {
        tanggal.setDate(tanggal.getDate() + 1);
        if (skipSunday && tanggal.getDay() === 0) continue;
        sisa--;
      }
      return tanggal.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function setQuickVal(val) {
      document.getElementById('inputAssembly').value = val;
      document.getElementById('inputFG').value = val;
    }

    function tambahDataHarian(e) {
      e.preventDefault();
      const tanggal = document.getElementById('inputTanggal').value;
      const assembly = Number(document.getElementById('inputAssembly').value);
      const fg = Number(document.getElementById('inputFG').value);
      const catatan = document.getElementById('inputCatatan').value;

      appData.logs.push({
        id: 'log-' + Date.now(),
        tanggal,
        assembly,
        fg,
        catatan
      });

      document.getElementById('inputAssembly').value = '';
      document.getElementById('inputFG').value = '';
      document.getElementById('inputCatatan').value = '';

      simpanData();
    }

    function editBaris(index) {
      const item = appData.logs[index];
      const newAssembly = prompt(`Ubah Output Assembly pada tanggal ${item.tanggal} (pcs):`, item.assembly);
      if (newAssembly === null) return;
      const newFG = prompt(`Ubah Transfer ke Finish Good pada tanggal ${item.tanggal} (pcs):`, item.fg);
      if (newFG === null) return;
      const newCatatan = prompt(`Ubah Catatan:`, item.catatan || '');

      appData.logs[index].assembly = Number(newAssembly) || 0;
      appData.logs[index].fg = Number(newFG) || 0;
      if (newCatatan !== null) appData.logs[index].catatan = newCatatan;

      simpanData();
    }

    function hapusBaris(index) {
      if (!confirm('Hapus baris data ini?')) return;
      appData.logs.splice(index, 1);
      simpanData();
    }

    function ubahTargetPO() {
      const newTarget = prompt('Masukkan Target Total 1 PO (pcs):', appData.targetPO);
      if (newTarget === null) return;
      const newPOName = prompt('Masukkan Nomor / Nama PO:', appData.poNumber);
      appData.targetPO = Number(newTarget) || 470;
      if (newPOName) appData.poNumber = newPOName;
      simpanData();
    }

    function resetKeDefault() {
      if (!confirm('Reset semua data kembali ke posisi awal (Target 470, Output 399)?')) return;
      appData = JSON.parse(JSON.stringify(defaultData));
      simpanData();
    }

    function salinLaporanWA() {
      const target = Number(appData.targetPO) || 470;
      const logs = Array.isArray(appData.logs) ? appData.logs : [];
      const totalOutput = logs.reduce((acc, i) => acc + (Number(i.assembly) || 0), 0);
      const totalFG = logs.reduce((acc, i) => acc + (Number(i.fg) || 0), 0);
      const shortage = Math.max(0, target - totalOutput);
      const wip = Math.max(0, totalOutput - totalFG);
      const teks = `*LAPORAN OUTPUT ASSEMBLY KOPER - GEDUNG C*\n*PT Kanindo Makmur Jaya 2*\n\n• Nomor PO: ${appData.poNumber}\n• Target PO: ${target} pcs\n• Total Output Assembly: ${totalOutput} pcs\n• Kekurangan (Shortage): ${shortage} pcs\n• Terkirim ke Finish Good: ${totalFG} pcs\n• WIP di Assembly: ${wip} pcs\n• Estimasi Selesai (15-18/hr): ${Math.ceil(shortage/18)} - ${Math.ceil(shortage/15)} hari kerja`;
      navigator.clipboard.writeText(teks);
      alert('Laporan WhatsApp berhasil disalin!');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
